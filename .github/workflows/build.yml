name: build

# Releases only after the ci workflow finishes green on main, so a red push never
# ships to installed copies through the updater. workflow_run also runs with a
# write token for Dependabot merges (ci is dispatched on main after each one), so
# dependency bumps release too. workflow_dispatch stays for a manual re-release.
on:
  workflow_run:
    workflows: [ci]
    types: [completed]
    branches: [main]
  workflow_dispatch:

# Never run two releases at once; a newer green ci on main waits its turn.
concurrency:
  group: release
  cancel-in-progress: false

jobs:
  build:
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (github.event.workflow_run.conclusion == 'success' &&
      contains(fromJSON('["push","workflow_dispatch"]'), github.event.workflow_run.event))
    runs-on: windows-latest
    permissions:
      contents: write
    steps:
      # Build exactly the commit ci tested, not whatever main points at now.
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.event.workflow_run.head_sha || github.sha }}

      - name: setup node
        uses: actions/setup-node@v7
        with:
          node-version: lts/*
          cache: npm

      - name: install Rust stable
        uses: dtolnay/rust-toolchain@stable

      - name: Rust cache
        uses: swatinem/rust-cache@v2
        with:
          workspaces: "./src-tauri -> target"

      - name: install frontend dependencies
        run: npm ci

      # Every push to main is a release; run number keeps versions monotonic.
      - name: set build version
        shell: pwsh
        run: |
          $version = "0.1.${{ github.run_number }}"
          $conf = Get-Content src-tauri/tauri.conf.json -Raw | ConvertFrom-Json
          $conf.version = $version
          $conf | ConvertTo-Json -Depth 20 | Set-Content src-tauri/tauri.conf.json
          Write-Host "building version $version"

      - uses: tauri-apps/tauri-action@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        with:
          tagName: v__VERSION__
          releaseName: "onslicer v__VERSION__"
          releaseBody: "Automated build from main."
          releaseDraft: false
          prerelease: false
