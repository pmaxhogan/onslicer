[package]
name = "onslicer"
version = "0.1.0"
description = "Browse your Onshape models and send them straight to your slicer"
license = "MIT"
edition = "2021"

[lib]
name = "onslicer_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tauri-plugin-store = "2"
tauri-plugin-process = "2"
reqwest = { version = "0.13.5", default-features = false, features = ["rustls-no-provider", "system-proxy"] }
rustls = { version = "0.23.46", default-features = false, features = ["ring", "std"] }
keyring = { version = "3", features = ["windows-native"] }
base64 = "0.23.1"
humantime = "2.4.0"
tokio = { version = "1.54.1", features = ["fs"] }

[target.'cfg(not(any(target_os = "android", target_os = "ios")))'.dependencies]
tauri-plugin-updater = "2"
